# worker-service configuration
#
# Resolution precedence for every setting:
#   environment variable  >  this config.ini  >  built-in default
#
# The binary looks for this file at: -config <path>, then $CONFIG_FILE,
# then ./config.ini, then config.ini next to the executable.

[server]
port = 8080

[database]
# Connect to Aurora PostgreSQL ONLY via the RDS Proxy endpoint.
host = my-rds-proxy.proxy-xxxxxxxx.us-east-1.rds.amazonaws.com
port = 5432
name = factoryops
user = factoryops_app
password = CHANGE_ME
# require (RDS Proxy enforces TLS) | disable (local Postgres without TLS)
sslmode = require
