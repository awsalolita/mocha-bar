<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FactoryOps · Event Console</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --muted: #8b949e;
      --text: #e6edf3; --accent: #2f81f7; --a: #3fb950; --b: #d29922;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); }
    header { padding: 18px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid;
      grid-template-columns: 360px 1fr; gap: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .card h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input, select { width: 100%; background: #0d1117; border: 1px solid var(--border);
      color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { margin-top: 16px; width: 100%; background: var(--accent); color: #fff; border: 0;
      padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .seg { display: flex; gap: 6px; margin-bottom: 6px; }
    .seg button { margin: 0; flex: 1; padding: 8px; background: #0d1117; border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
    .seg button.active { border-color: var(--accent); color: var(--text); }
    #result { margin-top: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word;
      background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; min-height: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .pill.A { background: rgba(63,185,80,.15); color: var(--a); }
    .pill.B { background: rgba(210,153,34,.15); color: var(--b); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .toolbar h2 { margin: 0; }
    .muted { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>FactoryOps</h1>
    <span class="tag">Event Console · ui-service</span>
  </header>
  <main>
    <section class="card">
      <h2>Publish event</h2>
      <div class="seg">
        <button id="btnA" class="active" onclick="setType('A')">Type A · Order</button>
        <button id="btnB" onclick="setType('B')">Type B · Operation</button>
      </div>

      <label>Event ID</label>
      <input id="event_id" placeholder="evt-0001" />

      <label>Order ID</label>
      <input id="order_id" placeholder="ORD-1001" />

      <div id="fieldsA">
        <label>Amount</label>
        <input id="amount" type="number" step="0.01" placeholder="129.99" />
      </div>

      <div id="fieldsB" style="display:none">
        <div class="row">
          <div>
            <label>Operator</label>
            <input id="operator" placeholder="op-alice" />
          </div>
          <div>
            <label>Operation</label>
            <select id="operation">
              <option>PACK</option>
              <option>SHIP</option>
            </select>
          </div>
        </div>
      </div>

      <label>Timestamp (ISO8601, optional)</label>
      <input id="ts" placeholder="leave blank for now()" />

      <button onclick="publish()">POST /api/events</button>
      <div id="result">Ready.</div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Consolidated events</h2>
        <button class="secondary" style="width:auto;margin:0;padding:6px 14px" onclick="refresh()">Refresh</button>
      </div>
      <p class="muted">GET /api/events — merged Type-A (Aurora) &amp; Type-B (DynamoDB)</p>
      <div id="events"><div class="empty">No data loaded yet.</div></div>
    </section>
  </main>

  <script>
    let currentType = 'A';
    function setType(t) {
      currentType = t;
      document.getElementById('btnA').classList.toggle('active', t === 'A');
      document.getElementById('btnB').classList.toggle('active', t === 'B');
      document.getElementById('fieldsA').style.display = t === 'A' ? '' : 'none';
      document.getElementById('fieldsB').style.display = t === 'B' ? '' : 'none';
    }

    function payload() {
      const e = {
        type: currentType,
        event_id: document.getElementById('event_id').value.trim(),
        order_id: document.getElementById('order_id').value.trim(),
        ts: document.getElementById('ts').value.trim(),
      };
      if (currentType === 'A') {
        e.amount = parseFloat(document.getElementById('amount').value || '0');
      } else {
        e.operator = document.getElementById('operator').value.trim();
        e.operation = document.getElementById('operation').value;
      }
      return e;
    }

    async function publish() {
      const res = document.getElementById('result');
      res.textContent = 'Sending...';
      try {
        const r = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload()),
        });
        const body = await r.text();
        res.textContent = `HTTP ${r.status}\n${body}`;
        if (r.ok) setTimeout(refresh, 400);
      } catch (err) {
        res.textContent = 'Error: ' + err;
      }
    }

    function rowsFrom(data) {
      const out = [];
      (data.type_a || []).forEach(x => out.push({
        type: 'A', event_id: x.event_id, order_id: x.order_id,
        detail: 'amount=' + x.amount, ts: x.ts,
      }));
      (data.type_b || []).forEach(x => out.push({
        type: 'B', event_id: x.event_id, order_id: x.order_id || '',
        detail: (x.operator || '') + ' / ' + (x.operation || ''), ts: x.ts,
      }));
      return out;
    }

    async function refresh() {
      const box = document.getElementById('events');
      box.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const r = await fetch('/api/events');
        const data = await r.json();
        const rows = rowsFrom(data);
        if (!rows.length) { box.innerHTML = '<div class="empty">No events yet.</div>'; return; }
        let html = '<table><thead><tr><th>Type</th><th>Event ID</th><th>Order</th><th>Detail</th><th>Timestamp</th></tr></thead><tbody>';
        for (const x of rows) {
          html += `<tr><td><span class="pill ${x.type}">${x.type}</span></td><td>${x.event_id}</td><td>${x.order_id}</td><td>${x.detail}</td><td>${x.ts}</td></tr>`;
        }
        html += '</tbody></table>';
        box.innerHTML = html;
      } catch (err) {
        box.innerHTML = '<div class="empty">Failed to load: ' + err + '</div>';
      }
    }

    refresh();
  </script>
</body>
</html>
