# core-service configuration
#
# Resolution precedence for every setting:
#   environment variable  >  this config.ini  >  built-in default
#
# The binary looks for this file at: -config <path>, then $CONFIG_FILE,
# then ./config.ini, then config.ini next to the executable.

[server]
port = 8080

[sqs]
# SQS queue for Type-B (asynchronous) events. REQUIRED for Type-B routing.
queue_url = https://sqs.us-east-1.amazonaws.com/123456789012/events-b-queue
# Region for the SQS/DynamoDB clients (used if AWS_REGION env is not set).
region = us-east-1

[dynamodb]
# Table scanned to build the consolidated GET /api/events view.
table = events_operations

[services]
# worker-service endpoint for Type-A (synchronous) events.
worker_service_url = http://worker.svc.internal:8080
