version: 0.2

phases:
  pre_build:
    commands:
      - S3_BUCKET=${S3_BUCKET:?S3_BUCKET is required}
      - DISTRIBUTION_ID=${DISTRIBUTION_ID:?DISTRIBUTION_ID is required}
      - BUILD_DIR=${BUILD_DIR:-dist}

  build:
    commands:
      - npm run build

  post_build:
    commands:
      # Long-cache hashed assets; short-cache HTML
      - aws s3 sync $BUILD_DIR/ s3://$S3_BUCKET/ --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html" --exclude "*.html"
      - aws s3 sync $BUILD_DIR/ s3://$S3_BUCKET/ --cache-control "public,max-age=60,must-revalidate" --exclude "*" --include "*.html"
      - |
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id $DISTRIBUTION_ID \
          --paths "/index.html" "/" \
          --query Invalidation.Id --output text)
      - echo "InvalidationId=$INVALIDATION_ID"

artifacts:
  base-directory: dist
  files:
    - '**/*'
