version: 0.2

env:
  variables:
    SOURCE_BUCKET: "source-code-098908345"
    SOURCE_KEY: "frontend.zip"
    DEST_BUCKET: "static-website-90893045"
    DISTRIBUTION_ID: "E24LGUP9JEXFS7"

phases:
  build:
    commands:
      - aws s3 cp "s3://$SOURCE_BUCKET/$SOURCE_KEY" frontend.zip
      - rm -rf site && unzip -o frontend.zip
      - aws s3 cp site/ "s3://$DEST_BUCKET/" --recursive
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/gacha.html"
