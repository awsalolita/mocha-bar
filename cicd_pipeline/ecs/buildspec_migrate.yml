version: 0.2

# Runs a one-off Fargate task (e.g. DB migration) and fails the build
# if the container exits non-zero. Typically wired as a stage before
# the ECS rolling / blue-green deploy.

phases:
  pre_build:
    commands:
      - ECS_CLUSTER=${ECS_CLUSTER:?ECS_CLUSTER is required}
      - MIGRATION_TASKDEF=${MIGRATION_TASKDEF:?MIGRATION_TASKDEF is required}
      - CONTAINER_NAME=${CONTAINER_NAME:-migrate}
      - SUBNETS=${SUBNETS:?SUBNETS is required}                       # comma-separated subnet ids
      - SECURITY_GROUPS=${SECURITY_GROUPS:?SECURITY_GROUPS is required}  # comma-separated sg ids
      - ASSIGN_PUBLIC_IP=${ASSIGN_PUBLIC_IP:-DISABLED}

  build:
    commands:
      - |
        TASK_ARN=$(aws ecs run-task \
          --cluster "$ECS_CLUSTER" \
          --task-definition "$MIGRATION_TASKDEF" \
          --launch-type FARGATE \
          --count 1 \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
          --query 'tasks[0].taskArn' --output text)
      - echo "TaskArn=$TASK_ARN"
      - aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

  post_build:
    commands:
      - |
        EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
          --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" --output text)
      - echo "Migration container '$CONTAINER_NAME' exit code: $EXIT_CODE"
      - |
        if [ "$EXIT_CODE" != "0" ]; then
          echo "Migration failed"; exit 1
        fi
