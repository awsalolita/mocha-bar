version: 0.2

phases:
  pre_build:
    commands:
      - REGISTRY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPOSITORY_URI=$REGISTRY_URI/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(TZ=Asia/Seoul date +"%Y-%m-%d.%H.%M.%S")
      - EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME:?EKS_CLUSTER_NAME is required}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME:-<APP>}
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY_URI
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

  build:
    commands:
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - docker run -v /var/run/docker.sock:/var/run/docker.sock public.ecr.aws/aquasecurity/trivy image --exit-code 1 --scanners vuln --pkg-types os --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - kubectl set image deployment/$DEPLOYMENT_NAME $DEPLOYMENT_NAME=$REPOSITORY_URI:$IMAGE_TAG -n $K8S_NAMESPACE
      - kubectl rollout status deployment/$DEPLOYMENT_NAME -n $K8S_NAMESPACE --timeout=180s
      - echo "Rolled $DEPLOYMENT_NAME to $REPOSITORY_URI:$IMAGE_TAG"

artifacts:
  files:
    - '**/*'
  name: eks-$(date +%Y%m%d%H%M%S)
